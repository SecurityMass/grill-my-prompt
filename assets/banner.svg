<svg xmlns="http://www.w3.org/2000/svg" width="470" height="120" viewBox="0 0 470 120" role="img" aria-label="/grill-my-prompt">
  <style>
    .cursor { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: type 8s steps(18) infinite; }
      .cursor { animation: move 8s steps(18) infinite, caret 8s step-end infinite; }
      .bar { stroke-dasharray: 1; animation: draw 8s ease-out infinite; }
      .bar + .bar { animation-delay: .2s; }
    }
    @keyframes type { 0% { transform: scaleX(0); } 15%, 100% { transform: scaleX(1); } }
    @keyframes move { 0% { transform: translateX(0); } 15%, 100% { transform: translateX(450px); } }
    @keyframes caret { 0% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes draw {
      0%, 15% { stroke-dashoffset: 1; opacity: 0; }
      25%, 100% { stroke-dashoffset: 0; opacity: var(--end, 1); }
    }
  </style>
  <clipPath id="typed"><rect class="reveal" width="458" height="80"/></clipPath>
  <g clip-path="url(#typed)">
    <!-- textLength keeps the width equal across fallback fonts, so the cursor lands on the last letter -->
    <text x="4" y="58" textLength="450" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700" fill="#e8590c">❯ /grill-my-prompt</text>
  </g>
  <rect class="cursor" x="4" y="24" width="4" height="42" fill="#e8590c"/>
  <g stroke="#e8590c" stroke-width="6" stroke-linecap="round">
    <path class="bar" pathLength="1" d="M8 84H458"/>
    <path class="bar" pathLength="1" d="M8 102H458" opacity=".45" style="--end:.45"/>
  </g>
</svg>
